name: ROS2 Humble Integration CI

on:
  push:
    branches:
      - main
      - "develop/**"
  pull_request:
    branches: [ main ]

jobs:
  ros2-humble:
    name: Test on Ubuntu 22.04 (ROS2 Humble)
    runs-on: ubuntu-22.04
    container:
      image: ros:humble-ros-base

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install System and Python Dependencies
        run: |
          apt-get update && apt-get install -y --no-install-recommends \
            python3-pip \
            python3-pytest \
            python3-pytest-cov \
            ros-humble-controller-manager \
            ros-humble-controller-manager-msgs \
            ros-humble-ros2-control \
            ros-humble-ros2-controllers \
            ros-humble-ros2controlcli \
            ros-humble-robot-state-publisher \
            ros-humble-xacro \
            ros-humble-joint-state-broadcaster \
            ros-humble-forward-command-controller \
            libgl1 \
            libglib2.0-0
          python3 -m pip install --upgrade pip
          python3 -m pip install -r requirements-dev.txt

      - name: Verify ros2_control Controller Environment Availability
        shell: bash
        run: |
          source /opt/ros/humble/setup.bash
          ros2 pkg prefix controller_manager
          ros2 pkg prefix forward_command_controller
          ros2 pkg prefix joint_state_broadcaster
          ros2 pkg prefix robot_state_publisher

      - name: Bytecode Compilation Check
        run: |
          python3 -m compileall .

      - name: Generate ArUco Marker Assets
        run: |
          python3 tools/generate_aruco_markers.py

      - name: Run Full Regression Suite (Phase B1 - B3)
        shell: bash
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: |
          source /opt/ros/humble/setup.bash
          python3 -m pytest -v -m "not ros2_control_e2e"

      - name: Run ros2_control Controller-Level E2E Gate (Phase B3.5)
        shell: bash
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: |
          source /opt/ros/humble/setup.bash
          python3 -m pytest -v -m "ros2_control_e2e"

      - name: Capture ROS2 Diagnostics on Failure
        if: failure()
        shell: bash
        run: |
          source /opt/ros/humble/setup.bash
          echo "=== ROS 2 Topics ==="
          timeout 5s ros2 topic list || true
          echo "=== Controller Manager Status ==="
          timeout 5s ros2 control list_controllers || true
          timeout 5s ros2 control list_hardware_components -v || true
          timeout 5s ros2 control list_hardware_interfaces || true

      - name: Run ROS2 JointState Diagnostic Probe Smoke
        shell: bash
        env:
          PYTHONPATH: "."
        run: |
          source /opt/ros/humble/setup.bash
          python3 tools/ros2_joint_state_probe.py --help
