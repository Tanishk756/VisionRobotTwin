name: CI Testing & Validation

on:
  push:
    branches:
      - main
      - "develop/**"
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test on Windows (Python ${{ matrix.python-version }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Upgrade pip and Install Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Bytecode Compilation Check
        run: |
          python -m compileall .

      - name: Generate ArUco Marker Assets
        run: |
          python tools/generate_aruco_markers.py

      - name: Run Test Suite (pytest)
        run: |
          pytest -v

      - name: Run Bounded Headless Synthetic Smoke (Panda IK)
        run: |
          python main.py --robot panda --synthetic --headless --max-frames 60

      - name: Run Bounded Headless Synthetic Smoke (KUKA iiwa IK)
        run: |
          python main.py --robot kuka_iiwa --synthetic --headless --max-frames 60

      - name: Run Bounded Headless Synthetic Smoke (Panda Resolved-Rate)
        run: |
          python main.py --robot panda --controller resolved-rate --synthetic --headless --max-frames 60
